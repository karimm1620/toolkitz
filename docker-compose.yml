services:
  backend:
    build:
      context: ./backend
    container_name: toolkitz-backend
    ports:
      - "3000:3000" # opsional: akses API langsung (debug / CLI). Web UI tidak butuh ini.
    restart: unless-stopped
    environment:
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        # Default "/api": browser memanggil nginx di origin yang sama, lalu nginx
        # meneruskan ke container backend. Jadi TIDAK perlu mengganti IP laptop
        # dan bisa diakses dari device mana pun (http://IP-LAPTOP).
        # Hanya isi URL penuh (contoh: http://192.168.1.10:3000/api) kalau
        # backend sengaja dipisah dari nginx.
        - VITE_API_URL=/api
    container_name: toolkitz-frontend
    ports:
      - "80:80" # Akses web via http://localhost atau http://IP-LAPTOP
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
