server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend menerima upload sampai 100MB (lihat BodyLimit di cmd/server/main.go).
    # Default nginx hanya 1MB, sehingga upload PDF/gambar besar ditolak 413.
    client_max_body_size 100m;

    # Reverse proxy ke container backend. URI (/api/...) diteruskan apa adanya.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        # Konversi LibreOffice / PDF besar bisa lama.
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
